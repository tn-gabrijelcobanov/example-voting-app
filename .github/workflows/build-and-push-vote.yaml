name: Build and push the Vote service to github repository

on:
  # we want pull requests so we can build(test) but not push to image registry
  push:
    branches:
      - 'main'
    # only build when important files change
    paths:
      - 'vote/**'
      - '.github/workflows/build-and-push-vote.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write    # This is required for the GITHUB_TOKEN to push to GHCR
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./vote  # The result folder relative to the root of the repo
          push: true
          tags: ghcr.io/tn-gabrijelcobanov/example-voting-app-vote-service:${{ github.sha }}

      - name: Update Kubernetes manifest
        run: |
          cd k8s-specifications
          kustomize edit set image ghcr.io/tn-gabrijelcobanov/example-voting-app-vote-service=ghcr.io/${{ github.actor }}/example-voting-app-vote-service:${{ github.sha }}

      - name: Commit and push changes of the manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update vote service image tag to ${{ github.sha }}"
          branch: main